name: publish

# Runs on every push to main. Releases only when the version in
# openajazz/__init__.py isn't on PyPI yet, so bumping the version = a release:
# PyPI upload (trusted publishing, no token stored anywhere), an AppImage,
# and a GitHub release with install notes. The web app deploys separately
# through Vercel's git integration.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,music]"
      - run: pytest -q

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing
      contents: write  # tag + github release
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: what is already published
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(python -c "import re; print(re.search(r'__version__ = \"(.+?)\"', open('openajazz/__init__.py').read()).group(1))")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if curl -sfo /dev/null "https://pypi.org/pypi/openajazz/$v/json"; then
            echo "pypi=false" >> "$GITHUB_OUTPUT"; echo "$v already on pypi"
          else
            echo "pypi=true" >> "$GITHUB_OUTPUT"
          fi
          # a release can be missing even when pypi has the version (e.g. a failed appimage build)
          if gh release view "v$v" -R "${{ github.repository }}" >/dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"; echo "v$v already released"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: build
        if: steps.version.outputs.pypi == 'true' || steps.version.outputs.release == 'true'
        run: pip install build && python -m build

      - name: upload to pypi
        if: steps.version.outputs.pypi == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: build appimage
        if: steps.version.outputs.release == 'true'
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          mkdir -p release
          mv dist/* release/
          packaging/appimage/build.sh
          mv dist/*.AppImage release/

      - name: github release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.version.outputs.version }}
        run: |
          # this version's section of CHANGELOG.md goes first
          awk -v v="## $V" '$0 == v {on=1; next} /^## / && on {exit} on' CHANGELOG.md > changes.md
          { echo "## What's new"; cat changes.md; echo; } > notes.md
          cat >> notes.md <<EOF
          ## Get it

          **No install:** open **https://openajazz.vercel.app** in Chrome, Edge or Opera on a computer.

          **Terminal (CLI + TUI):**
          \`\`\`sh
          pipx install 'openajazz[music]'      # or
          uv tool install 'openajazz[music]'   # or
          pip install --user 'openajazz[music]'
          \`\`\`

          **AppImage (Linux, nothing else needed):**
          \`\`\`sh
          curl -LO https://github.com/${{ github.repository }}/releases/download/v$V/openajazz-$V-x86_64.AppImage
          chmod +x openajazz-$V-x86_64.AppImage && ./openajazz-$V-x86_64.AppImage
          \`\`\`

          On Linux, run \`openajazz udev --install\` once so you don't need sudo.
          Unofficial, not affiliated with AJAZZ.

          EOF
          sed -i 's/^          //' notes.md
          cat notes.md
          gh release create "v$V" release/* --title "v$V" --notes-file notes.md --generate-notes
